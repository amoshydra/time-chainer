name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-please-master
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: node
          # A PAT can be supplied to let CI run on release-please PRs.
          # Falls back to the workflow token for normal release creation.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Checkout release commit
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Install Node.js
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/setup-node@v4
        with:
          # Trusted publishing requires Node 22.14+ and npm CLI 11.5.1+.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'

      - name: Install dependencies
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: yarn install --frozen-lockfile

      - name: Test
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: yarn test

      - name: Build
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: yarn build

      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created == 'true' }}
        # Trusted publishing authenticates with OIDC and generates provenance
        # automatically. NPM_TOKEN is intentionally not used here.
        run: npm publish --access public
